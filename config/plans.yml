enterprise:
  display_name: Enterprise
  seats:
    max: null # unlimited
  features:
    - inbound_emails
    - channel_email
    - help_center
    - agent_bots
    - macros
    - agent_management
    - team_management
    - inbox_management
    - labels
    - custom_attributes
    - automations
    - sla
    - custom_roles
    - audit_logs
    - disable_branding
    - captain_integration
  disabled_features: []


