name: Deploy to Azure VM

on:
  push:
    branches: 
      - main
      - develop
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_IMAGE: joyai/crove-rails
  AZURE_RG: Crove
  AZURE_VM: Crove-Dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: joyai
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get commit SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.sha.outputs.sha_short }}
          build-args: |
            RAILS_ENV=production
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure VM
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Backup database and deploy with data preservation
            az vm run-command invoke \
              --resource-group ${{ env.AZURE_RG }} \
              --name ${{ env.AZURE_VM }} \
              --command-id RunShellScript \
              --scripts "
                cd /home/joy
                
                # Create backup directory
                mkdir -p /home/joy/backups/database
                
                # Backup database before deployment
                echo 'Creating database backup...'
                TIMESTAMP=\$(date +'%Y%m%d_%H%M%S')
                docker exec crove-postgres pg_dump -U postgres -d chatwoot_production | gzip > /home/joy/backups/database/pre_deploy_\${TIMESTAMP}.sql.gz
                echo 'Database backup created: pre_deploy_\${TIMESTAMP}.sql.gz'
                
                # Pull latest image
                docker pull ${{ env.DOCKER_IMAGE }}:latest
                
                # IMPORTANT: Never stop or recreate database container
                # Stop only Rails and Sidekiq (keep database running)
                docker stop crove-rails crove-sidekiq || true
                docker rm crove-rails crove-sidekiq || true
                
                # Start Rails with updated image (using docker run to avoid docker-compose recreating containers)
                docker run -d --name crove-rails --restart always \
                  -p 3015:3000 \
                  --network crove-network \
                  -e RAILS_ENV=production \
                  -e DATABASE_URL=postgresql://postgres:postgres@crove-postgres:5432/chatwoot_production \
                  -e REDIS_URL=redis://crove-redis:6379 \
                  ${{ env.DOCKER_IMAGE }}:latest \
                  sh -c 'bundle exec rails server -b 0.0.0.0 -p 3000'
                
                # Start Sidekiq with updated image  
                docker run -d --name crove-sidekiq --restart always \
                  --network crove-network \
                  -e RAILS_ENV=production \
                  -e DATABASE_URL=postgresql://postgres:postgres@crove-postgres:5432/chatwoot_production \
                  -e REDIS_URL=redis://crove-redis:6379 \
                  ${{ env.DOCKER_IMAGE }}:latest \
                  bundle exec sidekiq -C config/sidekiq.yml
                
                # Wait for Rails to be ready
                sleep 15
                
                # Run migrations
                docker exec crove-rails bundle exec rails db:migrate RAILS_ENV=production
                
                # Check status
                docker ps
                echo 'Deployment completed successfully with data preservation!'
              "

      - name: Health Check
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Wait a bit for services to stabilize
            sleep 30
            
            # Check if Rails is responding
            az vm run-command invoke \
              --resource-group ${{ env.AZURE_RG }} \
              --name ${{ env.AZURE_VM }} \
              --command-id RunShellScript \
              --scripts "curl -f http://localhost:3010 || exit 1"

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Application: https://beta.crove.com"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:latest"

      - name: Rollback on Failure
        if: failure()
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "❌ Deployment failed, rolling back..."
            az vm run-command invoke \
              --resource-group ${{ env.AZURE_RG }} \
              --name ${{ env.AZURE_VM }} \
              --command-id RunShellScript \
              --scripts "
                cd /home/joy
                docker-compose -f docker-compose.production.yml down
                docker pull ${{ env.DOCKER_IMAGE }}:stable
                docker tag ${{ env.DOCKER_IMAGE }}:stable ${{ env.DOCKER_IMAGE }}:latest
                docker-compose -f docker-compose.production.yml up -d
              "